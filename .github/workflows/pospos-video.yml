# ポスポスの説明動画（TikTok・Instagram のリール用）を作って、サイトの /pospos-videos に置く。
# 台本（scripts/pospos-video/videos.mjs）に動画を足して push すると、まだ作っていない動画だけを作る。
# 作り直したいときは、corporate-site/public/pospos-videos/ のその動画（.mp4）を消して push する。
# 必要な設定：リポジトリの Settings → Secrets and variables → Actions に OPENAI_API_KEY（声を作るため）
name: POSPOS video

on:
  push:
    branches: [claude/dazzling-babbage-ikm2m6]
    paths:
      - scripts/pospos-video/**
      - .github/workflows/pospos-video.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pospos-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 日本語のフォントと ffmpeg を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: 撮影用のブラウザを入れる
        working-directory: scripts/pospos-video
        run: |
          npm init -y >/dev/null
          npm install playwright@1.49.1
          pip install numpy >/dev/null 2>&1 || true
          npx playwright install --with-deps chromium
      - name: 動画を作る
        working-directory: scripts/pospos-video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::OPENAI_API_KEY が設定されていません（声が作れません）"; exit 1; fi
          if [ ! -f ../../corporate-site/public/pospos-videos/ad-night-40.mp4 ]; then node ad.mjs; fi
          ONLY_MISSING=1 node render.mjs
      - name: サイトに置く（コミットして push → Cloudflare が自動で公開）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corporate-site/public/pospos-videos corporate-site/public/pospos-videos.html
          git commit -m "ポスポスの説明動画を作る" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
