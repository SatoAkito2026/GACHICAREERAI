<!doctype html>
<html lang="ja">
<head>
<!-- 待ち時間バトル（公開ページ）。ふたりのつながりは Supabase Realtime のブロードキャストだけを使う（公開キー・ログイン不要） -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="待ち時間バトル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F0FA">
<meta name="robots" content="noindex">
<meta name="description" content="ふたりでスマホ対戦できるミニゲーム集。招待コードを送るだけで、登録なしで遊べます。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>待ち時間バトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-width column, a sticky scoreboard header, each game is one card-sized stage. */
:root {
  --bg: #F2F0FA;
  --surface: #FFFFFF;
  --surface-2: #E8E4F6;
  --ink: #1F1B3A;
  --muted: #6A6488;
  --pink: #D93D73;
  --gold: #E9A522;
  --sky: #3A72CF;
  --ok: #1F9D6B;
  --ng: #D2463A;
  --line: #D9D3EE;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14122A; --surface: #211E3E; --surface-2: #2C2850; --ink: #F1EEFF; --muted: #A8A2C8;
  --pink: #FF6F9F; --gold: #FFC24D; --sky: #7FA9FF; --ok: #4FD49C; --ng: #FF7B6E; --line: #3A3566; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14122A; --surface: #211E3E; --surface-2: #2C2850; --ink: #F1EEFF; --muted: #A8A2C8;
  --pink: #FF6F9F; --gold: #FFC24D; --sky: #7FA9FF; --ok: #4FD49C; --ng: #FF7B6E; --line: #3A3566; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; display: flex; flex-direction: column; gap: 14px }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px;
  display: flex; flex-direction: column; gap: 8px }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.brand h1 { white-space: nowrap; font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: .02em; line-height: 1.2 }
.brand h1 span { color: var(--pink) }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px }
.who { display: flex; flex-direction: column; min-width: 0 }
.who.r { text-align: right }
.who small { color: var(--muted); font-size: 11px; letter-spacing: .08em }
.who b { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.vs .mid { font-family: var(--display); color: var(--gold); font-size: 18px }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 4px; vertical-align: middle }
.dot.on { background: var(--ok) }
.name-btn { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 900; text-align: left; cursor: pointer;
  text-decoration: underline dotted var(--muted); text-underline-offset: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700 }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; line-height: 1.35 }
.q { font-weight: 900; font-size: 20px; line-height: 1.5; text-wrap: balance; margin: 0 }
p { margin: 0 }
.muted { color: var(--muted); font-size: 14px }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px }

.games { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.game { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 14px;
  text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 118px; position: relative; overflow: hidden }
.game:active { transform: scale(.98) }
.game .ico { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--c) }
.game b { font-weight: 900; font-size: 16px }
.game span { font-size: 12px; color: var(--muted); line-height: 1.5 }
.game.wide { grid-column: 1 / -1; min-height: 0 }

.btn { appearance: none; border: 0; border-radius: 999px; padding: 13px 18px; font: inherit; font-weight: 900; cursor: pointer;
  background: var(--pink); color: #fff; font-size: 16px }
.btn.ghost { background: var(--surface-2); color: var(--ink) }
.btn.small { padding: 8px 14px; font-size: 14px }
.btn:disabled { opacity: .45; cursor: default }
.btn:focus-visible, .game:focus-visible, .choice:focus-visible, .key:focus-visible, .col:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.row.end { justify-content: flex-end }
.row > .grow { flex: 1 1 auto }

input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink) }
input[type=text]:focus { outline: none; border-color: var(--sky) }

.choices { display: flex; flex-direction: column; gap: 8px }
.choice { appearance: none; text-align: left; font: inherit; font-weight: 700; padding: 12px 14px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); display: flex; justify-content: space-between; gap: 8px }
.choice.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)) }
.choice.wrong { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 12%, var(--surface)) }
.choice .tags { font-size: 12px; color: var(--muted); white-space: nowrap }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.ans { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; overflow-wrap: anywhere }
.ans small { display: block; color: var(--muted); font-size: 11px }
.ans b { font-size: 18px }
.verdict { font-family: var(--display); font-size: 24px; text-align: center }
.verdict.good { color: var(--ok) } .verdict.bad { color: var(--ng) }

.progress { display: flex; gap: 4px }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2) }
.progress i.done { background: var(--gold) }
.progress i.now { background: var(--pink) }

.hist { display: flex; flex-direction: column; gap: 6px; font-size: 14px }
.hist div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 4px }
.hist div > span:first-child { min-width: 0; overflow-wrap: anywhere }

.big { font-family: var(--display); font-size: 44px; line-height: 1.1; text-align: center; font-variant-numeric: tabular-nums }
.wait { text-align: center; color: var(--muted); font-weight: 700; padding: 8px }
.wait::after { content: "…"; display: inline-block; animation: blink 1.2s infinite }
@keyframes blink { 50% { opacity: .2 } }

/* reflex pad */
.pad { border: 0; width: 100%; min-height: 240px; border-radius: 20px; font-family: var(--display); font-size: 34px; color: #fff; cursor: pointer;
  background: var(--sky); touch-action: manipulation; user-select: none; -webkit-user-select: none }
.pad.wait { background: var(--ng) }
.pad.go { background: var(--ok) }
.pad.idle { background: var(--surface-2); color: var(--ink); font-family: var(--body); font-weight: 900; font-size: 18px }

/* connect four */
.board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--sky); padding: 8px; border-radius: 16px; max-width: 100% }
.col { appearance: none; border: 0; background: none; padding: 0; display: grid; grid-template-rows: repeat(6, 1fr); gap: 4px; cursor: pointer; border-radius: 10px }
.col:disabled { cursor: default }
.col:not(:disabled):hover { background: color-mix(in srgb, #fff 15%, transparent) }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--bg) }
.cell.p0 { background: var(--pink) } .cell.p1 { background: var(--gold) }
.cell.last { box-shadow: inset 0 0 0 3px color-mix(in srgb, #fff 70%, transparent) }
.cell.win { box-shadow: inset 0 0 0 4px var(--ink) }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 4px }
.chip.p0 { background: var(--pink) } .chip.p1 { background: var(--gold) }

/* keypad */
.slots { display: flex; justify-content: center; gap: 10px }
.slot { width: 56px; height: 64px; border-radius: 12px; border: 2px solid var(--line); display: grid; place-items: center;
  font-family: var(--display); font-size: 32px; background: var(--bg) }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px }
.key { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px 0;
  font-family: var(--display); font-size: 22px; cursor: pointer; font-variant-numeric: tabular-nums }
.key:disabled { opacity: .3; cursor: default }
.hb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px }
.hb th { font-size: 11px; color: var(--muted); font-weight: 700; text-align: left; padding: 4px }
.hb td { padding: 6px 4px; border-top: 1px dashed var(--line) }
.hb td.g { font-family: var(--display); letter-spacing: .15em }
.tag { display: inline-block; border-radius: 6px; padding: 0 6px; font-weight: 900; font-size: 13px }
.tag.h { background: var(--pink); color: #fff } .tag.b { background: var(--gold); color: #1F1B3A }
.hbcols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.hbcols > div { min-width: 0 }

/* action games */
.act canvas { width: 100%; display: block; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none }
#act-msg { display: flex; flex-direction: column; gap: 10px; text-align: center }
#act-msg:empty { display: none }
.ctrl { display: flex; justify-content: space-between; align-items: center; gap: 12px }
.stick { width: 132px; height: 132px; border-radius: 50%; background: var(--surface-2); position: relative; touch-action: none; flex: none;
  border: 2px solid var(--line) }
.knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--sky);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--sky) 55%, #000); pointer-events: none }
.kick, .mash { border: 0; color: #fff; font-family: var(--display); background: var(--pink); cursor: pointer; touch-action: manipulation;
  user-select: none; -webkit-user-select: none; box-shadow: 0 6px 0 color-mix(in srgb, var(--pink) 55%, #000) }
.kick { width: 116px; height: 116px; border-radius: 50%; font-size: 22px; flex: none }
.mash { width: 100%; height: 120px; border-radius: 20px; font-size: 38px }
.mash:disabled { opacity: .4; cursor: default }
.kick:active, .mash:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--pink) 55%, #000) }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; max-width: 230px }
.btns .big { grid-column: 1 / -1 }
.gbtn { appearance: none; border: 0; border-radius: 14px; padding: 14px 6px; font-family: var(--display); font-size: 16px; color: #fff; background: var(--sky); cursor: pointer;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--sky) 55%, #000); touch-action: manipulation; user-select: none; -webkit-user-select: none; min-width: 0 }
.gbtn.big { background: var(--pink); box-shadow: 0 4px 0 color-mix(in srgb, var(--pink) 55%, #000); font-size: 18px; padding: 16px 6px }
.gbtn:disabled { opacity: .45; cursor: default }
.gbtn:not(:disabled):active { transform: translateY(3px); box-shadow: none }
.sec-title { display: flex; align-items: baseline; gap: 8px }
.sec-title b { font-family: var(--display); font-weight: 400; font-size: 18px }

/* ゲーム中：画面にぴったり収めて、ページはスクロールさせない（アプリのように） */
button { -webkit-touch-callout: none }
.howto-btn { display: none }
html.playing, html.playing body { overflow: hidden; overscroll-behavior: none; height: 100% }
html.playing body { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px) }
html.playing .wrap { height: 100%; padding-block: 6px; gap: 0 }
html.playing header { display: none }
html.playing #app { flex: 1; min-height: 0; display: flex; flex-direction: column }
html.playing #app > section { flex: 1; min-height: 0; gap: 6px !important }
html.playing #app > section > .row:first-child .eyebrow { display: none }
html.playing #app > section > .row:first-child h2 { font-size: 18px }
html.playing .howto-btn { display: inline-flex }
html.playing .card.act { flex: 1; min-height: 0; padding: 0 !important; border: 0; background: none; gap: 8px; position: relative }
html.playing .card.act > p.muted { display: none }
html.playing.howto .card.act > p.muted { display: block; position: absolute; inset: 0 0 auto 0; z-index: 5; max-height: 75%; overflow: auto; background: var(--surface);
  color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25) }
html.playing #act-msg { position: absolute; left: 10px; right: 10px; top: 42%; transform: translateY(-50%); z-index: 4; padding: 14px; border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 8px 30px rgba(0,0,0,.25) }
html.playing .stick { width: 120px; height: 120px }
html.playing .card.act > .ctrl, html.playing .card.act > .row, html.playing .card.act > .mash { margin-top: auto }
html.playing .card.act > .row + .row { margin-top: 0 }
html.playing .gbtn { padding-block: 20px }
/* 全画面のゲーム（カート）：画面いっぱいに描いて、ボタンは下の両はしに半透明で重ねる */
html.playing.full .wrap { padding: 0; max-width: none }
html.ingame header { display: none }
.kpad .wide { flex: 1; pointer-events: auto }
.kbtn.big { width: 96px; height: 96px; font-size: 20px }
.kbtn.pill { width: auto; height: 62px; border-radius: 31px; padding: 0 16px; font-size: 15px }
.kpad .stick { background: rgba(20,18,42,.25); border-color: rgba(255,255,255,.55) }
.kpad .knob { background: rgba(255,255,255,.75); box-shadow: none }
.kpad .mash { width: 100%; height: 110px; opacity: .92 }
html.playing.full #app > section > .row:first-child { position: fixed; z-index: 10; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 50%; transform: translateX(-50%); gap: 6px; flex-wrap: nowrap }
html.playing.full #app > section > .row:first-child .grow { display: none }
html.playing.full #app > section > .row:first-child .btn { background: rgba(20,18,42,.45); color: #fff; padding: 6px 12px; font-size: 13px; white-space: nowrap; flex: none }
html.playing.full .card.act { position: fixed; inset: 0; z-index: 1 }
html.playing.full .card.act canvas { border-radius: 0 }
.kpad { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)) }
.kpad .grp { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto }
.kpad .grp.col { flex-direction: column; align-items: center }
.kbtn { width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(20,18,42,.32); color: #fff; font-family: var(--display); font-size: 24px;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; padding: 0; display: grid; place-items: center }
.kbtn.small { width: 62px; height: 62px; font-size: 12px }
.kbtn:active { background: rgba(255,255,255,.35) }
.kbtn:disabled { opacity: .4 }
.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; font-size: 14px }
.stages { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.chipbtn { appearance: none; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 6px; font: inherit; font-weight: 900; font-size: 14px; cursor: pointer }
.chipbtn.on { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 14%, var(--surface)) }

/* ゲーム中は、2本指でさわってもページが拡大・選択されないようにする（iPhone で画面がずれてボタンが消えるのを防ぐ） */
html.playing.full, html.playing.full body { touch-action: none; overscroll-behavior: none }
html.playing.full .card.act, html.playing.full .card.act * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none }
html.playing.full .card.act > p.muted, html.playing.full #act-msg, html.playing.full #act-msg *, #sens, #sens * { touch-action: pan-y }
html.playing .br #act-msg [data-br="start"], html.playing .kt #act-msg [data-act="act-ready"] { position: sticky; bottom: 0; box-shadow: 0 -6px 12px color-mix(in srgb, var(--surface) 90%, transparent) }
html.playing .br #act-msg .chipbtn { padding: 6px 4px; font-size: 12px } html.playing .br #act-msg .eyebrow { margin: 0 }
/* 感度設定 */
#sens { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px }
.sens-box { max-height: calc(100% - 8px); overflow: auto; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.3) }
.sens-box p { margin: 0 }
.sens-row { display: grid; grid-template-columns: 1fr 44px; gap: 2px 8px; font-size: 13px; align-items: center }
.sens-row span { grid-column: 1 / -1 } .sens-row input { width: 100%; accent-color: var(--pink) } .sens-row b { font-family: var(--display); text-align: right }
/* カートレース（横画面） */
html.playing .kt #act-msg, html.playing .hd #act-msg { top: 50%; left: 50%; right: auto; width: min(560px, calc(100% - 24px)); transform: translate(-50%, -50%); max-height: calc(100% - 24px); overflow: auto; padding: 10px 14px; gap: 6px }
.kt .stages { grid-template-columns: repeat(3, 1fr); gap: 6px } .kt .stages .chipbtn { padding: 8px 4px; font-size: 13px }
.kt-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px } .kt-pick .chipbtn { padding: 5px 2px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap }
.kt-pick .chipbtn i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.3); flex: none }
html.playing .br.picking #act-msg, html.playing .kt.picking #act-msg { left: auto; right: 10px; transform: translateY(-50%); width: min(470px, 58%) }
.kt .kbtn { width: 84px; height: 84px } .kt .kbtn.small { width: 66px; height: 66px }
.kt .kpad { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)) }
/* 11人サッカー */
html.playing .sc3 #act-msg { top: 50%; left: 50%; right: auto; width: min(760px, calc(100% - 20px)); transform: translate(-50%, -50%); max-height: calc(100% - 20px); overflow: auto; padding: 10px 12px; gap: 6px }
.sc-teams { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px } .sc-teams.sm .chipbtn { padding: 6px 2px; font-size: 11px }
.sc-team { appearance: none; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-align: left; font: inherit }
.sc-team.on { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 12%, var(--surface)) }
.sc-team b { font-size: 11px; display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden } .sc-team b i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; flex: none }
.sc-team span { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 3px } .sc-team em { font-style: normal; font-size: 9px; color: var(--muted) }

    four: { off: 1, name: "4目並べ", ico: "●", c: "var(--gold)", desc: "コインを落として、縦・横・ななめに4つそろえたら勝ち" },

  function render() {
    const playing = !ui.renaming && !!ACTION[me.m.g];
    document.documentElement.classList.toggle("playing", playing);
    document.documentElement.classList.toggle("full", playing && !!ACTION[me.m.g].full);
    document.documentElement.classList.toggle("ingame", !ui.renaming && me.m.g !== "menu");
    if (!playing) document.documentElement.classList.remove("howto");
    const active = document.activeElement;
    const focusId = active && active.id;
    const sel = active && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;

    const o = opp();
    const nPeers = peers.filter((p) => p.presence && p.presence.cid && p.presence.cid !== cid).length;
    $("#opp-name").textContent = nPeers > 1 ? `${nPeers}人` : o ? (o.n || "あいて") : "まだいません";
    $("#name-btn").textContent = myName;
    $("#conn").innerHTML = room
      ? `<span class="dot ${connected && o ? "on" : ""}"></span>${cpuActive() ? "CPUと対戦" : o ? "ふたりで接続中" : connected ? "あいて待ち" : "再接続中"}`
      : `<span class="dot ${cpuActive() ? "on" : ""}"></span>${cpuActive() ? "CPUと対戦" : "ひとりモード"}`;

    if (!ui.renaming && ACTION[me.m.g]) {
      const key = me.m.g + ":" + me.m.e;
      if (mountedKey !== key) { stopAct(); $("#app").innerHTML = ACTION[me.m.g].shell(); mountedKey = key; actStop = ACTION[me.m.g].mount() }
      return;
    }
    if (mountedKey) stopAct();

    let html = "";
    if (ui.renaming) html = renderRename();
    else if (me.m.g === "menu") html = renderMenu();
    else html = (RENDER[me.m.g] || renderMenu)();
    $("#app").innerHTML = html;

    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]) } catch (e) {} }
    }
    if (me.m.g === "reflex") reflexTick();
  }

  // ---------- アプリとして入れる ----------
  let installEvt = null;
  const isStandalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true } catch (e) { return false } };
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; render() });
  addEventListener("appinstalled", () => { installEvt = null; ui.installHelp = false; render() });
  function renderInstall() {
    const help = !ui.installHelp ? "" : isIOS()
      ? `<ol class="steps"><li>Safari の下にある<b>共有ボタン</b>（四角から矢印）を押す</li><li><b>「ホーム画面に追加」</b>を押す</li><li>右上の<b>「追加」</b>を押すと、ホーム画面にアイコンができます</li></ol><p class="muted">Safari 以外（LINE の中のブラウザなど）では追加できません。Safari で開き直してください。</p>`
      : `<ol class="steps"><li>ブラウザの右上の<b>︙（メニュー）</b>を押す</li><li><b>「アプリをインストール」</b>か<b>「ホーム画面に追加」</b>を押す</li></ol><p class="muted">LINE などのアプリの中で開いているときは、Chrome で開き直してください。</p>`;
    return `<section class="card" style="gap:10px"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span><b>アプリとして入れる</b><br><span class="muted">ホーム画面のアイコンから、全画面で遊べます</span></span>
      <button class="btn small" style="white-space:nowrap" data-act="install">${installEvt ? "インストール" : "やり方"}</button></div>${help}</section>`;
  }
  function renderInvite() {
    if (inviteCode) {
      const real = realOppPeer();
      return `<section class="card" style="gap:10px"><p class="eyebrow">招待コード</p>
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="big" style="letter-spacing:.12em;text-align:left">${esc(inviteCode)}</div>
        <button class="btn ghost small" data-act="code-copy">${codeState === "copied" ? "コピーしました" : "コピー"}</button></div>
        ${SITE ? `<button class="btn small" data-act="code-link">${codeState === "linked" ? "リンクをコピーしました" : "招待リンクを送る"}</button>` : ""}
        <p class="muted">${real ? `<span class="dot on"></span>${esc(real.presence.n || "あいて")}とつながりました` : "このコードを相手に送ってね。相手が入力するとつながります"}</p>
        <button class="btn ghost small" data-act="code-leave">コードをやめる</button></section>`;
    }
    return `<section class="card" style="gap:10px"><p class="eyebrow">招待コードでつながる</p>
      <button class="btn" data-act="code-new">招待コードを発行</button>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="code-input" inputmode="numeric" maxlength="4" placeholder="もらったコード（4ケタ）" value="${esc(ui.codeDraft || "")}" autocomplete="off" style="flex:1;min-width:0">
      <button class="btn small" data-act="code-join">つながる</button></div>
      ${codeErr ? `<p class="muted" style="color:var(--ng)">${esc(codeErr)}</p>` : `<p class="muted">4ケタを入れると自動でつながります。</p>`}</section>`;
  }
  async function useChannel(code) {
    if (!lobby) return;
    chanUnsubs.forEach((u) => { try { u() } catch (e) {} }); chanUnsubs = [];
    if (room && room !== lobby) { try { await room.leave() } catch (e) {} }
    else { try { await lobby.presence({ cid: null, n: null, m: null, s: null, x: null }) } catch (e) {} }
    let ch = lobby;
    if (code) {
      try { ch = await lobby.join("gc-" + code) } catch (e) { codeErr = "つながれませんでした。もう一度ためしてね"; code = ""; ch = lobby }
    }
    inviteCode = code; ss.set("code", code);
    if (SITE) { try { history.replaceState(null, "", code ? "#" + code : location.pathname) } catch (e) {} }
    room = ch; peers = ch.peers().slice(); connected = ch.connected();
    chanUnsubs.push(ch.onConnection((c) => { connected = c; if (c) push(); render() }));
    chanUnsubs.push(ch.onPeers((chg) => { peers = chg.peers.slice(); adopt(); render() }, () => {}));
    push(); adopt(); render();
  }
  function joinCode(v) {
    const code = String(v || "").replace(/\D/g, "");
    if (code.length !== 4) { codeErr = "4ケタの数字を入れてね"; render(); return }
    codeErr = ""; ui.codeDraft = ""; useChannel(code);
  }

  function renderRename() {
    return `<section class="card">
      <h2>名前をかえる</h2>
      <input type="text" id="name-input" maxlength="12" value="${esc(myName)}" autocomplete="off">
      <div class="row end"><button class="btn ghost small" data-act="rename-cancel">やめる</button><button class="btn small" data-act="rename-save">決定</button></div>
    </section>`;
  }

  function renderMenu() {
    const o = opp();
    let notice = "";
    const real = realOppPeer();
    const cpuRow = real ? "" : `<div class="note row" style="justify-content:space-between;flex-wrap:nowrap"><span style="flex:1;min-width:0">あいてがいない時は<b>コンピューター</b>と対戦</span>
      <button class="btn small ${cpuOn ? "" : "ghost"}" data-act="cpu-toggle" aria-pressed="${cpuOn}">${cpuOn ? "オン" : "オフ"}</button></div>`;
    if (!room) notice = `<div class="note">ふたりで対戦するには、このページを相手にも共有して、それぞれのスマホで開いてね。開くと自動でつながります。</div>`;
    else if (!real) notice = `<div class="note">つながると上の「あいて」に名前が出ます。どちらかがゲームを選ぶと、ふたりとも同じゲームに切りかわります。</div>`;
    notice += cpuRow + `<div class="note row" style="justify-content:space-between;flex-wrap:nowrap"><span style="flex:1;min-width:0">操作の<b>感度</b>（カート・サッカー・荒野バトルなど全部に効く）</span><button class="btn small ghost" data-act="sens">感度設定</button></div>`;
    if (lobby) notice = renderInvite() + notice;
    if (SITE && !isStandalone()) notice = renderInstall() + notice;
    const cards = (grp) => Object.entries(GAMES).filter(([, g]) => (g.grp || "brain") === grp && !g.off).map(([k, g], i) => `
      <button class="game ${i === 0 ? "wide" : ""}" style="--c:${g.c}" data-act="start" data-g="${k}">
        <span class="ico">${g.ico}</span><b>${g.name}</b><span>${g.desc}</span>
      </button>`).join("");
    return `<section style="display:flex;flex-direction:column;gap:12px">
      ${notice}
      <p class="sec-title"><b>体をうごかす</b><span class="muted">リアルタイム対戦</span></p>
      <div class="games">${cards("body")}</div>
      <p class="sec-title"><b>頭をつかう</b><span class="muted">じっくり対戦</span></p>
      <div class="games">${cards("brain")}</div>
      <p class="muted">名前は上の「${esc(myName)}」をタップすると変えられます。</p>
      <p class="muted" style="text-align:center;font-size:11px">バージョン ${APP_VER}</p>
    </section>`;
  }

  function topBar(title, sub) {
    return `<div class="row"><div class="grow"><p class="eyebrow">${esc(sub || "")}</p><h2>${esc(title)}</h2></div>
      <button class="btn ghost small howto-btn" data-act="howto">遊び方</button><button class="btn ghost small" data-act="sens">感度</button><button class="btn ghost small" data-act="menu">メニュー</button></div>`;
  }
  function needOpp() { return opp() ? "" : `<div class="note">あいてがまだいません。相手がページを開くと始まります。</div>` }
  function progress(n, done, now) { let s = ""; for (let i = 0; i < n; i++) s += `<i class="${i < done ? "done" : i === now ? "now" : ""}"></i>`; return `<div class="progress">${s}</div>` }

  // ===== 以心伝心 =====
  const ISHIN_N = 8;
  function ishinPrompts() { return shuffle(ISHIN, rng(me.m.seed)).slice(0, ISHIN_N) }
  const norm = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s、。!?！？・「」『』'"~〜]/g, "")
    .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  function ishinMatch(i, myA, opA, myOk, opOk) {
    return norm(myA[i]) === norm(opA[i]) || (myOk || []).includes(i) || (opOk || []).includes(i);
  }
  function renderIshin() {
    const P = ishinPrompts(), os = oppS() || {};
    const myA = me.s.a || [], opA = os.a || [];
    const R = Math.min(myA.length, opA.length);
    let score = 0; for (let i = 0; i < R; i++) if (ishinMatch(i, myA, opA, me.s.ok, os.ok)) score++;
    let body = "";
    if (R > 0) {
      const i = R - 1, hit = ishinMatch(i, myA, opA, me.s.ok, os.ok);
      body += `<div class="card" style="gap:10px">
        <p class="eyebrow">第${i + 1}問の答え ― ${esc(P[i])}</p>
        <div class="pair"><div class="ans"><small>${esc(myName)}</small><b>${esc(myA[i])}</b></div><div class="ans"><small>${esc(oppName())}</small><b>${esc(opA[i])}</b></div></div>
        <div class="verdict ${hit ? "good" : "bad"}">${hit ? "そろった！" : "ざんねん…"}</div>
        ${hit ? "" : `<button class="btn ghost small" data-act="ishin-ok" data-i="${i}">ほぼ同じ！一致にする</button>`}
      </div>`;
    }
    if (R >= ISHIN_N) {
      const msg = score >= 7 ? "以心伝心マスター！" : score >= 5 ? "かなり気が合うふたり" : score >= 3 ? "まあまあ通じあってる" : "これから知っていこう";
      body += `<section class="card"><p class="eyebrow">結果</p><div class="big">${score} / ${ISHIN_N}</div><p class="verdict good">${msg}</p>
        <button class="btn" data-act="start" data-g="ishin">もう一回</button></section>`;
    } else if (myA.length > R) {
      body += `<section class="card"><p class="eyebrow">第${R + 1}問</p><p class="q">${esc(P[R])}</p>
        <div class="ans"><small>あなたの答え</small><b>${esc(myA[R])}</b></div><p class="wait">${esc(oppName())}の答えを待っています</p></section>`;
    } else {
      body += `<section class="card"><p class="eyebrow">第${R + 1}問 / ${ISHIN_N}</p><p class="q">${esc(P[R])}</p>
        <input type="text" id="ishin-input" maxlength="30" placeholder="ひとことで答えてね" value="${esc(ui.draft)}" autocomplete="off" enterkeyhint="send">
        <button class="btn" data-act="ishin-send">答えを送る</button>
        <p class="muted">短く書くとそろいやすいよ。ひらがな・カタカナの違いは同じとみなします。</p></section>`;
    }
    return `<section style="display:flex;flex-direction:column;gap:12px">${topBar("以心伝心", `いっち ${score}問`)}${progress(ISHIN_N, R, R)}${needOpp()}${body}</section>`;
  }

  // ===== クイズ =====
  const QUIZ_N = 10;
  function quizSet() {
    const r = rng(me.m.seed);
    return shuffle(QUIZ, r).slice(0, QUIZ_N).map((x) => {
      const opts = shuffle([x.a, ...x.w], r);
      return { q: x.q, opts, ans: opts.indexOf(x.a) };
    });
  }
  function renderQuiz() {
    const Q = quizSet(), os = oppS() || {};
    const mine = me.s.q || [], theirs = os.q || [];
    const R = Math.min(mine.length, theirs.length);
    let ms = 0, os2 = 0;
    for (let i = 0; i < R; i++) { if (mine[i] === Q[i].ans) ms++; if (theirs[i] === Q[i].ans) os2++ }
    const sub = `${esc(myName)} ${ms} − ${os2} ${esc(oppName())}`;
    let body = "";
    if (R > 0 && R <= QUIZ_N) {
      const i = R - 1, q = Q[i];
      body += `<div class="card" style="gap:10px"><p class="eyebrow">第${i + 1}問の答え</p><p style="font-weight:700">${esc(q.q)}</p>
        <div class="choices">${q.opts.map((t, k) => {
          const tags = [mine[i] === k ? "あなた" : "", theirs[i] === k ? esc(oppName()) : ""].filter(Boolean).join("・");
          const cls = k === q.ans ? "right" : (mine[i] === k || theirs[i] === k) ? "wrong" : "";
          return `<div class="choice ${cls}"><span>${esc(t)}</span><span class="tags">${tags}</span></div>`;
        }).join("")}</div></div>`;
    }
    if (R >= QUIZ_N) {
      const res = ms > os2 ? "あなたの勝ち！" : ms < os2 ? "あなたの負け…" : "引き分け！";
      body += `<section class="card"><p class="eyebrow">結果</p><div class="big">${ms} − ${os2}</div><p class="verdict ${ms >= os2 ? "good" : "bad"}">${res}</p>
        <button class="btn" data-act="start" data-g="quiz">別の問題でもう一回</button></section>`;
    } else if (mine.length > R) {
      body += `<section class="card"><p class="eyebrow">第${R + 1}問</p><p class="q">${esc(Q[R].q)}</p><p class="ans"><small>あなたの答え</small><b>${esc(Q[R].opts[mine[R]])}</b></p><p class="wait">${esc(oppName())}が考え中</p></section>`;
    } else {
      body += `<section class="card"><p class="eyebrow">第${R + 1}問 / ${QUIZ_N}</p><p class="q">${esc(Q[R].q)}</p>
        <div class="choices">${Q[R].opts.map((t, k) => `<button class="choice" data-act="quiz-pick" data-k="${k}">${esc(t)}</button>`).join("")}</div></section>`;
    }
    return `<section style="display:flex;flex-direction:column;gap:12px">${topBar("ディズニークイズ", sub)}${progress(QUIZ_N, R, R)}${needOpp()}${body}</section>`;
  }

  // ===== 反射神経 =====
  const RX_N = 5, FLY = 1000;
  let rx = { e: 0, round: -1, phase: "idle", timer: null, sigAt: 0 };
  function rxRound() { const os = oppS() || {}; return Math.min((me.s.rt || []).length, (os.rt || []).length) }
  function reflexTick() {
    if (rx.e !== me.m.e) { clearTimeout(rx.timer); rx = { e: me.m.e, round: -1, phase: "idle", timer: null, sigAt: 0 } }
    const os = oppS(); if (!os) return;
    const R = rxRound(); if (R >= RX_N) return;
    const myRt = me.s.rt || [];
    const bothReady = (me.s.rdy ?? -1) >= R && (os.rdy ?? -1) >= R && myRt.length === R;
    if (bothReady && rx.round !== R) {
      rx.round = R; rx.phase = "wait";
      const r = rng(me.m.seed + R * 7919); r();
      const delay = 1500 + r() * 3000;
      rx.timer = setTimeout(() => { if (rx.round === R && rx.phase === "wait") { rx.phase = "go"; rx.sigAt = performance.now(); paintPad(); SND.play("go") } }, delay);
      paintPad();
    }
  }
  function paintPad() {
    const pad = $("#pad"); if (!pad) return;
    pad.className = "pad " + (rx.phase === "go" ? "go" : rx.phase === "wait" ? "wait" : "idle");
    pad.textContent = rx.phase === "go" ? "タップ！" : rx.phase === "wait" ? "まだ…" : "";
  }
  function reflexTap() {
    if (rx.phase === "wait") { clearTimeout(rx.timer); rx.phase = "done"; SND.play("ng"); setS({ rt: [...(me.s.rt || []), FLY] }) }
    else if (rx.phase === "go") { const t = Math.round(performance.now() - rx.sigAt); rx.phase = "done"; SND.play("pop"); setS({ rt: [...(me.s.rt || []), t] }) }
  }
  const fmt = (ms) => ms >= FLY ? "フライング" : `${ms}ms`;
  function renderReflex() {
    const os = oppS() || {}, R = rxRound();
    const mine = me.s.rt || [], theirs = os.rt || [];
    const sum = (a) => a.slice(0, R).reduce((x, y) => x + y, 0);
    const rows = []; for (let i = 0; i < R; i++) rows.push(`<div><span>${i + 1}回目</span><span>${fmt(mine[i])} ／ ${fmt(theirs[i])}</span></div>`);
    let stage = "";
    if (R >= RX_N) {
      const a = sum(mine), b = sum(theirs);
      stage = `<section class="card"><p class="eyebrow">結果（合計タイム・小さいほうが勝ち）</p><div class="pair"><div class="ans"><small>${esc(myName)}</small><b>${a}ms</b></div><div class="ans"><small>${esc(oppName())}</small><b>${b}ms</b></div></div>
        <p class="verdict ${a <= b ? "good" : "bad"}">${a < b ? "あなたの勝ち！" : a > b ? "あなたの負け…" : "引き分け！"}</p>
        <button class="btn" data-act="start" data-g="reflex">もう一回</button></section>`;
    } else if (mine.length > R) {
      stage = `<section class="card"><p class="eyebrow">${R + 1}回目</p><div class="big">${fmt(mine[R])}</div><p class="wait">${esc(oppName())}の結果を待っています</p></section>`;
    } else if ((me.s.rdy ?? -1) < R) {
      stage = `<section class="card"><p class="eyebrow">${R + 1}回目 / ${RX_N}</p><p>ふたりとも「準備OK」を押すとスタート。赤い画面が<b>緑</b>になった瞬間にタップ！早すぎるとフライング（1000ms）。</p>
        <button class="btn" data-act="rx-ready">準備OK</button></section>`;
    } else {

  const SUPA_WS = "wss://lcqpihitxmqaygriuhao.supabase.co/realtime/v1/websocket?vsn=1.0.0&apikey=" + "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcXBpaGl0eG1xYXlncml1aGFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMDQ1ODAsImV4cCI6MjA5NTY4MDU4MH0.vgZf_BwO58wnt5tKJO9jzJhkNarveb9A-_us-dxynVM";
  let SITE = false;
  // ホーム画面のアプリ（とくに iPhone）は前の版を開いたままになりやすいので、新しい版が出ていたらお知らせする
  const APP_VER = "1031-0354";
  async function checkVer() {
    if (!SITE || APP_VER.startsWith("__")) return;
    try { const t = await (await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })).text(), m = t.match(/const APP_VER = "([^"]+)"/); if (!m || m[1] === APP_VER || $("#newver")) return;
      const el = document.createElement("div"); el.id = "newver"; el.style.cssText = "position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:80;background:#1F1B3A;color:#fff;border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;font:700 13px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.3)";
      el.innerHTML = `新しいバージョンがあります<button class="btn small" id="newver-go">更新する</button>`; document.body.appendChild(el); $("#newver-go").addEventListener("click", () => location.reload()) } catch (_) {}
  }
  setTimeout(checkVer, 4000); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVer() });
  function supaLobby() {
    return { connected: () => true, peers: () => [], onPeers: () => () => {}, onConnection: () => () => {}, presence: async () => {}, leave: async () => {}, join: async (name) => supaChannel(name) };
  }
  function supaChannel(name) {
    const topic = "realtime:gcplay-" + name, me_ = rid();
    let ws = null, ref = 0, joined = false, closed = false, mine = {}, lastSent = 0, timer = null;
    const peerMap = new Map(), hs = new Set(), chs = new Set();
    const list = () => [{ peer: me_, isMe: true, presence: mine, updatedAt: Date.now() }, ...[...peerMap.values()].map((p) => p.v)];
    const emitPeers = () => { const l = list(); hs.forEach((h) => { try { h({ peers: l }) } catch (e) {} }) };
    const setConn = (v) => { if (joined !== v) { joined = v; chs.forEach((h) => { try { h(v) } catch (e) {} }) } };
    const raw = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)) };
    const bc = (event, payload) => { if (joined) raw({ topic, event: "broadcast", payload: { type: "broadcast", event, payload }, ref: String(++ref), join_ref: "1" }) };
    const flush = () => { timer = null; lastSent = Date.now(); bc("p", { from: me_, st: mine, t: lastSent }) };
    // 人数が多いほど送る間隔をあける（全員に届く数が人数の2乗で増え、上限をこえると遅れがたまるため）
    const gap = () => { const n = peerMap.size + 1; return Math.max(66, Math.round(1000 * n * (n - 1) / 300)) };
    const schedule = () => { if (!timer) timer = setTimeout(flush, Math.max(0, gap() - (Date.now() - lastSent))) };
    function connect() {
      if (closed) return;
      try { ws = new WebSocket(SUPA_WS) } catch (e) { setTimeout(connect, 3000); return }
      ws.onopen = () => raw({ topic, event: "phx_join", payload: { config: { broadcast: { self: false, ack: false }, presence: { key: "" }, private: false } }, ref: "1", join_ref: "1" });
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data) } catch (_) { return }
        if (m.event === "phx_reply" && m.ref === "1") { if (m.payload && m.payload.status === "ok") { setConn(true); bc("hello", { from: me_ }); flush() } return }
        if (m.event !== "broadcast" || !m.payload) return;
        const ev = m.payload.event, d = m.payload.payload || {};
        if (!d.from || d.from === me_) return;
        if (ev === "hello") flush();
        else if (ev === "bye") { if (peerMap.delete(d.from)) emitPeers() }
        else if (ev === "p" && d.st && typeof d.st === "object") {
          const prev = peerMap.get(d.from), js = JSON.stringify(d.st), now = Date.now();
          // 時計のずれ：あいての時計 −（受けとった時の自分の時計）。通信の遅れがいちばん小さかった値を、少しずつ新しくしながら使う
          let off = prev ? prev.v.off : null, offAt = prev ? prev.offAt : 0; if (typeof d.t === "number") { const smp = d.t - now; if (off == null || smp > off || now - offAt > 20000) { off = smp; offAt = now } }
          if (prev && prev.js === js) { prev.seen = now; prev.v.off = off; prev.offAt = offAt; return }
          peerMap.set(d.from, { js, seen: now, offAt, v: { peer: d.from, isMe: false, presence: d.st, updatedAt: now, off } }); emitPeers();
        }
      };
      ws.onclose = () => { setConn(false); if (!closed) setTimeout(connect, 1200 + Math.random() * 1500) };
      ws.onerror = () => { try { ws.close() } catch (_) {} };
    }
    const hb = setInterval(() => raw({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++ref) }), 25000);
    const beat = setInterval(() => {
      flush(); const now = Date.now(); let ch = false;
      peerMap.forEach((p, k2) => { if (now - p.seen > 9000) { peerMap.delete(k2); ch = true } }); if (ch) emitPeers();
    }, 3000);
    const bye = () => bc("bye", { from: me_ });
    addEventListener("pagehide", bye);
    connect();
    return {
      name, connected: () => joined, peers: () => list(),
      onPeers(h) { hs.add(h); return () => hs.delete(h) }, onConnection(h) { chs.add(h); return () => chs.delete(h) },
      async presence(patch) { const n = Object.assign({}, mine); for (const k2 in patch) { if (patch[k2] === null) delete n[k2]; else n[k2] = patch[k2] } mine = n; schedule() },
      async leave() { bye(); closed = true; clearInterval(hb); clearInterval(beat); removeEventListener("pagehide", bye); setConn(false); try { ws && ws.close() } catch (_) {} },
    };
  }

  // ---------- connect ----------
  render();
  (async () => {
    try {
      const inArtifact = !!(window.claude && window.claude.use);
      const r = inArtifact ? await window.claude.use("room") : null;
      if (!r && inArtifact) { render(); return }
      SITE = !r;
      if (SITE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
      if (SITE && !isStandalone() && document.fullscreenEnabled) {
        const goFull = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {}) };
        document.addEventListener("pointerup", goFull, { once: true });
      }
      lobby = r || supaLobby(); room = lobby;
      const hc = (location.hash || "").slice(1);
      if (SITE && /^\d{4}$/.test(hc)) inviteCode = hc;
      await useChannel(inviteCode);
    } catch (e) { room = null; render() }
  })();
})();
</script>
