<!doctype html>
<html lang="ja">
<head>
<!-- 待ち時間バトル（公開ページ）。ふたりのつながりは Supabase Realtime のブロードキャストだけを使う（公開キー・ログイン不要） -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="ふたりでスマホ対戦できるミニゲーム集。招待コードを送るだけで、登録なしで遊べます。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>待ち時間バトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-width column, a sticky scoreboard header, each game is one card-sized stage. */
:root {
  --bg: #F2F0FA;
  --surface: #FFFFFF;
  --surface-2: #E8E4F6;
  --ink: #1F1B3A;
  --muted: #6A6488;
  --pink: #D93D73;
  --gold: #E9A522;
  --sky: #3A72CF;
  --ok: #1F9D6B;
  --ng: #D2463A;
  --line: #D9D3EE;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14122A; --surface: #211E3E; --surface-2: #2C2850; --ink: #F1EEFF; --muted: #A8A2C8;
  --pink: #FF6F9F; --gold: #FFC24D; --sky: #7FA9FF; --ok: #4FD49C; --ng: #FF7B6E; --line: #3A3566; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14122A; --surface: #211E3E; --surface-2: #2C2850; --ink: #F1EEFF; --muted: #A8A2C8;
  --pink: #FF6F9F; --gold: #FFC24D; --sky: #7FA9FF; --ok: #4FD49C; --ng: #FF7B6E; --line: #3A3566; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; display: flex; flex-direction: column; gap: 14px }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px;
  display: flex; flex-direction: column; gap: 8px }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.brand h1 { white-space: nowrap; font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: .02em; line-height: 1.2 }
.brand h1 span { color: var(--pink) }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px }
.who { display: flex; flex-direction: column; min-width: 0 }
.who.r { text-align: right }
.who small { color: var(--muted); font-size: 11px; letter-spacing: .08em }
.who b { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.vs .mid { font-family: var(--display); color: var(--gold); font-size: 18px }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 4px; vertical-align: middle }
.dot.on { background: var(--ok) }
.name-btn { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 900; text-align: left; cursor: pointer;
  text-decoration: underline dotted var(--muted); text-underline-offset: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700 }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; line-height: 1.35 }
.q { font-weight: 900; font-size: 20px; line-height: 1.5; text-wrap: balance; margin: 0 }
p { margin: 0 }
.muted { color: var(--muted); font-size: 14px }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px }

.games { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.game { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 14px;
  text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 118px; position: relative; overflow: hidden }
.game:active { transform: scale(.98) }
.game .ico { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--c) }
.game b { font-weight: 900; font-size: 16px }
.game span { font-size: 12px; color: var(--muted); line-height: 1.5 }
.game.wide { grid-column: 1 / -1; min-height: 0 }

.btn { appearance: none; border: 0; border-radius: 999px; padding: 13px 18px; font: inherit; font-weight: 900; cursor: pointer;
  background: var(--pink); color: #fff; font-size: 16px }
.btn.ghost { background: var(--surface-2); color: var(--ink) }
.btn.small { padding: 8px 14px; font-size: 14px }
.btn:disabled { opacity: .45; cursor: default }
.btn:focus-visible, .game:focus-visible, .choice:focus-visible, .key:focus-visible, .col:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.row.end { justify-content: flex-end }
.row > .grow { flex: 1 1 auto }

input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink) }
input[type=text]:focus { outline: none; border-color: var(--sky) }

.choices { display: flex; flex-direction: column; gap: 8px }
.choice { appearance: none; text-align: left; font: inherit; font-weight: 700; padding: 12px 14px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); display: flex; justify-content: space-between; gap: 8px }
.choice.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)) }
.choice.wrong { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 12%, var(--surface)) }
.choice .tags { font-size: 12px; color: var(--muted); white-space: nowrap }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.ans { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; overflow-wrap: anywhere }
.ans small { display: block; color: var(--muted); font-size: 11px }
.ans b { font-size: 18px }
.verdict { font-family: var(--display); font-size: 24px; text-align: center }
.verdict.good { color: var(--ok) } .verdict.bad { color: var(--ng) }

.progress { display: flex; gap: 4px }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2) }
.progress i.done { background: var(--gold) }
.progress i.now { background: var(--pink) }

.hist { display: flex; flex-direction: column; gap: 6px; font-size: 14px }
.hist div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 4px }
.hist div > span:first-child { min-width: 0; overflow-wrap: anywhere }

.big { font-family: var(--display); font-size: 44px; line-height: 1.1; text-align: center; font-variant-numeric: tabular-nums }
.wait { text-align: center; color: var(--muted); font-weight: 700; padding: 8px }
.wait::after { content: "…"; display: inline-block; animation: blink 1.2s infinite }
@keyframes blink { 50% { opacity: .2 } }

/* reflex pad */
.pad { border: 0; width: 100%; min-height: 240px; border-radius: 20px; font-family: var(--display); font-size: 34px; color: #fff; cursor: pointer;
  background: var(--sky); touch-action: manipulation; user-select: none; -webkit-user-select: none }
.pad.wait { background: var(--ng) }
.pad.go { background: var(--ok) }
.pad.idle { background: var(--surface-2); color: var(--ink); font-family: var(--body); font-weight: 900; font-size: 18px }

/* connect four */
.board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--sky); padding: 8px; border-radius: 16px; max-width: 100% }
.col { appearance: none; border: 0; background: none; padding: 0; display: grid; grid-template-rows: repeat(6, 1fr); gap: 4px; cursor: pointer; border-radius: 10px }
.col:disabled { cursor: default }
.col:not(:disabled):hover { background: color-mix(in srgb, #fff 15%, transparent) }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--bg) }
.cell.p0 { background: var(--pink) } .cell.p1 { background: var(--gold) }
.cell.last { box-shadow: inset 0 0 0 3px color-mix(in srgb, #fff 70%, transparent) }
.cell.win { box-shadow: inset 0 0 0 4px var(--ink) }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 4px }
.chip.p0 { background: var(--pink) } .chip.p1 { background: var(--gold) }

/* keypad */
.slots { display: flex; justify-content: center; gap: 10px }
.slot { width: 56px; height: 64px; border-radius: 12px; border: 2px solid var(--line); display: grid; place-items: center;
  font-family: var(--display); font-size: 32px; background: var(--bg) }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px }
.key { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px 0;
  font-family: var(--display); font-size: 22px; cursor: pointer; font-variant-numeric: tabular-nums }
.key:disabled { opacity: .3; cursor: default }
.hb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px }
.hb th { font-size: 11px; color: var(--muted); font-weight: 700; text-align: left; padding: 4px }
.hb td { padding: 6px 4px; border-top: 1px dashed var(--line) }
.hb td.g { font-family: var(--display); letter-spacing: .15em }
.tag { display: inline-block; border-radius: 6px; padding: 0 6px; font-weight: 900; font-size: 13px }
.tag.h { background: var(--pink); color: #fff } .tag.b { background: var(--gold); color: #1F1B3A }
.hbcols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.hbcols > div { min-width: 0 }

/* action games */
.act canvas { width: 100%; display: block; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none }
#act-msg { display: flex; flex-direction: column; gap: 10px; text-align: center }
#act-msg:empty { display: none }
.ctrl { display: flex; justify-content: space-between; align-items: center; gap: 12px }
.stick { width: 132px; height: 132px; border-radius: 50%; background: var(--surface-2); position: relative; touch-action: none; flex: none;
  border: 2px solid var(--line) }
.knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--sky);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--sky) 55%, #000); pointer-events: none }
.kick, .mash { border: 0; color: #fff; font-family: var(--display); background: var(--pink); cursor: pointer; touch-action: manipulation;
  user-select: none; -webkit-user-select: none; box-shadow: 0 6px 0 color-mix(in srgb, var(--pink) 55%, #000) }
.kick { width: 116px; height: 116px; border-radius: 50%; font-size: 22px; flex: none }
.mash { width: 100%; height: 120px; border-radius: 20px; font-size: 38px }
.mash:disabled { opacity: .4; cursor: default }
.kick:active, .mash:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--pink) 55%, #000) }
.sec-title { display: flex; align-items: baseline; gap: 8px }
.sec-title b { font-family: var(--display); font-weight: 400; font-size: 18px }

@media (prefers-reduced-motion: reduce) { .wait::after { animation: none } .game:active { transform: none } }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>待ち時間<span>バトル</span></h1>
      <span class="muted" id="conn"><span class="dot"></span>接続中</span>
    </div>
    <div class="vs">
      <div class="who"><small>あなた</small><button class="name-btn" id="name-btn" data-act="rename">プレイヤー</button></div>
      <div class="mid">VS</div>
      <div class="who r"><small>あいて</small><b id="opp-name">まだいません</b></div>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
(() => {
  // ---------- small utils ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ls = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
  const ss = { get(k) { try { return sessionStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { sessionStorage.setItem(k, v) } catch (e) {} } };
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
  function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
  const rid = () => Math.random().toString(36).slice(2, 10);

  // ---------- content ----------
  const QUIZ = [
    { q: "東京ディズニーランドが開園したのは何年？", a: "1983年", w: ["1979年", "1988年", "1991年"] },
    { q: "東京ディズニーシーが開園したのは何年？", a: "2001年", w: ["1998年", "2003年", "2005年"] },
    { q: "ミッキーマウスの誕生日は？", a: "11月18日", w: ["4月15日", "12月5日", "9月4日"] },
    { q: "ミッキーのデビュー作として知られる短編は？", a: "蒸気船ウィリー", w: ["ミッキーの大演奏会", "ファンタジア", "ミッキーの汽車旅行"] },
    { q: "ドナルドダックのガールフレンドは？", a: "デイジー", w: ["クララベル", "ミニー", "クラリス"] },
    { q: "チップとデール、赤い鼻なのはどっち？", a: "デール", w: ["チップ", "ふたりとも", "どちらでもない"] },
    { q: "グーフィーは何の動物？", a: "犬", w: ["牛", "馬", "クマ"] },
    { q: "『ライオン・キング』シンバのお父さんの名前は？", a: "ムファサ", w: ["スカー", "ラフィキ", "ザズー"] },
    { q: "『アラジン』のジーニーが叶えられる願いの数は？", a: "3つ", w: ["1つ", "5つ", "無限"] },
    { q: "『リトル・マーメイド』アリエルの親友の魚は？", a: "フランダー", w: ["セバスチャン", "スカットル", "ドリー"] },
    { q: "『トイ・ストーリー』ウッディの持ち主の男の子は？", a: "アンディ", w: ["シド", "ボニー", "ミゲル"] },
    { q: "『美女と野獣』ベルのお父さんの名前は？", a: "モーリス", w: ["ガストン", "ルミエール", "コグスワース"] },
    { q: "『シンデレラ』で魔法が解けてしまう時刻は？", a: "夜中の12時", w: ["夜の10時", "夜中の1時", "夜明け"] },
    { q: "『白雪姫』に出てくる小人は何人？", a: "7人", w: ["5人", "6人", "8人"] },
    { q: "『モンスターズ・インク』でサリーの相棒は？", a: "マイク", w: ["ランドール", "ブー", "セリア"] },
    { q: "『ファインディング・ニモ』ニモのお父さんの名前は？", a: "マーリン", w: ["ギル", "クラッシュ", "ブルース"] },
    { q: "『塔の上のラプンツェル』のカメレオンの名前は？", a: "パスカル", w: ["マキシマス", "ミーコ", "アブー"] },
    { q: "『ズートピア』の主人公のウサギの警官は？", a: "ジュディ・ホップス", w: ["ニック・ワイルド", "ボゴ署長", "フラッシュ"] },
    { q: "『リメンバー・ミー』のミゲルがなりたいものは？", a: "ミュージシャン", w: ["料理人", "靴職人", "画家"] },
    { q: "ダッフィーの友だちで、絵を描くのが好きな猫は？", a: "ジェラトーニ", w: ["ステラ・ルー", "クッキー・アン", "オル・メル"] },
    { q: "くまのプーさんの大好物は？", a: "はちみつ", w: ["りんご", "ドーナツ", "メープルシロップ"] },
    { q: "プーさんたちが暮らす森の名前は？", a: "100エーカーの森", w: ["まよいの森", "しずかな森", "はちみつの森"] },
    { q: "『ベイマックス』の舞台になる街は？", a: "サンフランソウキョウ", w: ["ニューヨーキョウ", "トーキョーベイ", "サンディエゴシティ"] },
    { q: "『モアナと伝説の海』に出てくる半神の名前は？", a: "マウイ", w: ["タマトア", "テ・カァ", "ヘイヘイ"] },
    { q: "2024年に東京ディズニーシーに開業した新エリアは？", a: "ファンタジースプリングス", w: ["ファンタジーランド", "ロストリバーデルタ", "ミステリアスアイランド"] },
    { q: "ディズニーシーの真ん中にそびえる火山の名前は？", a: "プロメテウス火山", w: ["ビッグサンダー火山", "マウント・ドゥーム", "アトランティス火山"] },
    { q: "『カーズ』の主人公のレースカーは？", a: "ライトニング・マックィーン", w: ["メーター", "ドック・ハドソン", "サリー"] },
    { q: "ピノキオがうそをつくと伸びるのは？", a: "鼻", w: ["耳", "髪", "足"] },
    { q: "空を飛ぶダンボは何の動物？", a: "ゾウ", w: ["ネズミ", "カバ", "ウサギ"] },
    { q: "スティッチの試作品番号は？", a: "626", w: ["624", "707", "001"] },
    { q: "『アナと雪の女王』オラフがあこがれている季節は？", a: "夏", w: ["春", "秋", "冬"] },
    { q: "『ピーター・パン』の妖精の名前は？", a: "ティンカー・ベル", w: ["シルバーミスト", "フェアリー・ゴッドマザー", "ウェンディ"] },
  ];
  const ISHIN = [
    "ディズニーで一番好きなキャラは？", "今日いちばん乗りたいアトラクションは？", "パークで絶対食べたいものは？",
    "ポップコーンの好きな味は？", "一番好きなディズニー映画は？", "一番好きなプリンセスは？",
    "ランドとシー、どっちが好き？", "一番こわいアトラクションは？", "パレードで一番会いたいキャラは？",
    "好きなヴィランズは？", "ディズニーの曲で一番好きなのは？", "お土産で買いたいものは？",
    "好きなピクサー作品は？", "チュロスの好きな味は？", "ショーとパレード、どっちが好き？",
    "「ディズニー」と言えば？（ひとこと）", "一番好きな動物のキャラは？", "今日の夜ごはんに食べたいものは？",
    "ふたりをディズニーのペアにたとえると？", "今日の帰りは何時ごろ？", "次にふたりで行きたい旅行先は？",
    "今の気分をひとことで？", "カチューシャにするなら誰の？", "一番好きな脇役キャラは？",
  ];

  // ---------- state ----------
  let cid = ss.get("cid"); if (!cid) { cid = rid(); ss.set("cid", cid) }
  let myName = ls.get("name") || "プレイヤー";
  const MENU = { g: "menu", e: 0, host: "" };
  let me = { m: MENU, s: { e: 0 } };
  try { const saved = JSON.parse(ss.get("me") || "null"); if (saved && saved.m && saved.s) me = saved } catch (e) {}
  let room = null, connected = false, peers = [];
  // lobby = このページを開いている全員。招待コードを使うと、同じコードの人だけの部屋（room.join）に切りかえる
  let lobby = null, chanUnsubs = [], inviteCode = ss.get("code") || "", codeState = "", codeErr = "";
  let ui = { renaming: false, draft: "", hbEntry: "" };

  function push() {
    ss.set("me", JSON.stringify(me));
    if (room) room.presence({ cid, n: myName, m: me.m, s: me.s }).catch(() => {});
  }
  function setS(patch) { me.s = Object.assign({}, me.s, patch); push(); render() }
  function startMatch(g) {
    const e = Date.now();
    me.m = { g, e, host: cid, seed: Math.floor(Math.random() * 1e9) };
    me.s = { e };
    ui.draft = ""; ui.hbEntry = "";
    push(); render(); window.scrollTo({ top: 0 });

          const tags = [mine[i] === k ? "あなた" : "", theirs[i] === k ? esc(oppName()) : ""].filter(Boolean).join("・");
          const cls = k === q.ans ? "right" : (mine[i] === k || theirs[i] === k) ? "wrong" : "";
          return `<div class="choice ${cls}"><span>${esc(t)}</span><span class="tags">${tags}</span></div>`;
        }).join("")}</div></div>`;
    }

      body += `<section class="card"><p class="eyebrow">結果</p><div class="big">${ms} − ${os2}</div><p class="verdict ${ms >= os2 ? "good" : "bad"}">${res}</p>
        <button class="btn" data-act="start" data-g="quiz">別の問題でもう一回</button></section>`;
    } else if (mine.length > R) {
      body += `<section class="card"><p class="eyebrow">第${R + 1}問</p><p class="q">${esc(Q[R].q)}</p><p class="ans"><small>あなたの答え</small><b>${esc(Q[R].opts[mine[R]])}</b></p><p class="wait">${esc(oppName())}が考え中</p></section>`;
    } else {

        <div class="choices">${Q[R].opts.map((t, k) => `<button class="choice" data-act="quiz-pick" data-k="${k}">${esc(t)}</button>`).join("")}</div></section>`;
    }

  }

  // ===== 反射神経 =====
  const RX_N = 5, FLY = 1000;
  let rx = { e: 0, round: -1, phase: "idle", timer: null, sigAt: 0 };
  function rxRound() { const os = oppS() || {}; return Math.min((me.s.rt || []).length, (os.rt || []).length) }
  function reflexTick() {

        <p class="verdict ${a <= b ? "good" : "bad"}">${a < b ? "あなたの勝ち！" : a > b ? `${esc(oppName())}の勝ち！` : "引き分け！"}</p>

    return `<section style="display:flex;flex-direction:column;gap:12px">${topBar("反射神経", "あなた ／ あいて")}${progress(RX_N, R, R)}${needOpp()}${stage}

  // ===== 4目並べ =====
  const W = 7, H = 6;
  function fourState() {

  function checkWin(g, c, r, p) {

    else status = myTurn ? `<b>あなたの番</b> <span class="chip p${st.myP}"></span>好きな列をタップ` : `<span class="wait">${esc(oppName())}の番</span>`;

      }

    }
    return `<section style="display:flex;flex-direction:column;gap:12px">${topBar("4目並べ", isFirst() ? "あなたが先手" : "あなたが後手")}${needOpp()}
      <section class="card"><div class="row" style="justify-content:space-between"><span><span class="chip p${st.myP}"></span>あなた</span><span><span class="chip p${1 - st.myP}"></span>${esc(oppName())}</span></div>
      <div class="board">${cols}</div><div style="text-align:center;min-height:36px">${status}</div>
      ${over ? `<button class="btn" data-act="start" data-g="four">もう一回</button>` : ""}</section></section>`;
  }

  // ===== 数当て（ヒット&ブロー） =====
  const HB_MAX = 10;
  function hbScore(secret, guess) { let h = 0, b = 0; for (let i = 0; i < 3; i++) { if (guess[i] === secret[i]) h++; else if (secret.includes(guess[i])) b++ } return { h, b } }
  function keypad(actOk, okLabel) {
    const e = ui.hbEntry;

    const keys = "1234567890".split("").map((d) => `<button class="key" data-act="hb-key" data-d="${d}" ${e.includes(d) || e.length >= 3 ? "disabled" : ""}>${d}</button>`).join("");
    return `<div class="slots">${slots}</div><div class="keys">${keys}</div>
      <div class="row"><button class="btn ghost grow" data-act="hb-del">1文字けす</button><button class="btn grow" data-act="${actOk}" ${e.length === 3 ? "" : "disabled"}>${okLabel}</button></div>`;
  }
  function renderHb() {
    const os = oppS() || {};
    const mySec = me.s.sec || "", opSec = os.sec || "";
    const myG = me.s.gs || [], opG = os.gs || [];
    let body = "";
    if (!mySec) {
      body = `<section class="card"><p class="eyebrow">まず秘密の数字をきめる</p><p>ちがう数字を3つ選んでね（例：<b>270</b>）。相手はこれを当てにきます。</p>${keypad("hb-secret", "この数字にする")}</section>`;
    } else if (!opSec) {
      body = `<section class="card"><p class="eyebrow">あなたの秘密の数字</p><div class="big">${esc(mySec)}</div><p class="wait">${esc(oppName())}が数字を決めています</p></section>`;
    } else {
      const solved = (arr, sec) => arr.findIndex((g) => g === sec);
      const myWin = solved(myG, opSec), opWin = solved(opG, mySec);
      const firstMe = isFirst();
      const fLen = firstMe ? myG.length : opG.length, sLen = firstMe ? opG.length : myG.length;
      const fSolved = firstMe ? myWin : opWin, sSolved = firstMe ? opWin : myWin;
      const over = (fSolved >= 0 || sSolved >= 0 || fLen >= HB_MAX) && fLen === sLen;

      const row = (g, sec) => { const s = hbScore(sec, g); return `<tr><td class="g">${esc(g)}</td><td>${s.h === 3 ? `<span class="tag h">正解！</span>` : `<span class="tag h">${s.h}H</span> <span class="tag b">${s.b}B</span>`}</td></tr>` };
      let status = "";

        status = `<p class="verdict ${a && !b ? "good" : !a && b ? "bad" : ""}">${a && b ? "同時正解で引き分け！" : a ? "あなたの勝ち！" : b ? `${esc(oppName())}の勝ち！` : "どちらも当てられず引き分け"}</p>
          <div class="pair"><div class="ans"><small>あなたの数字</small><b>${esc(mySec)}</b></div><div class="ans"><small>${esc(oppName())}の数字</small><b>${esc(opSec)}</b></div></div>
          <button class="btn" data-act="start" data-g="hb">もう一回</button>`;
      } else if (myTurn) {

      } else {
        status = `<p class="wait">${esc(oppName())}が予想中</p>`;
      }
      body = `<section class="card">${status}</section>
        <section class="card"><div class="hbcols">
          <div><p class="eyebrow">あなたの予想</p><table class="hb"><tbody>${myG.map((g) => row(g, opSec)).join("") || `<tr><td class="muted">まだなし</td></tr>`}</tbody></table></div>
          <div><p class="eyebrow">${esc(oppName())}の予想</p><table class="hb"><tbody>${opG.map((g) => row(g, mySec)).join("") || `<tr><td class="muted">まだなし</td></tr>`}</tbody></table></div>
        </div><p class="muted"><span class="tag h">H</span> 数字も場所も合ってる ／ <span class="tag b">B</span> 数字だけ合ってる。あなたの数字は <b>${esc(mySec)}</b></p></section>`;
    }
    return `<section style="display:flex;flex-direction:column;gap:12px">${topBar("数当て", isFirst() ? "あなたが先攻" : "あなたが後攻")}${needOpp()}${body}</section>`;
  }

  // ================= アクション（リアルタイム） =================
  const ACTION = {};
  let mountedKey = null, actStop = null, actKey = null;
  function stopAct() { if (actStop) actStop(); actStop = null; actKey = null; ui.soloSoccer = null; mountedKey = null }
  function rtOppPeer() { const p = oppPeer(); return p && p.presence.x && p.presence.x.e === me.m.e ? p : null }
  function sendX(o) { if (room) room.presence({ x: Object.assign({ e: me.m.e }, o) }).catch(() => {}) }
  function loop(fn) {
    let alive = true, last = performance.now();
    const f = (t) => { if (!alive) return; const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t; try { fn(dt) } catch (e) { console.error(e) } requestAnimationFrame(f) };

  }
  function canvasFor(cv, ratio) {
    const w = cv.clientWidth || 300, h = Math.round(w * ratio);

    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);

  }
  function setMsg(html) { const el = $("#act-msg"); if (el && el._h !== html) { el._h = html; el.innerHTML = html } }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const keys = new Set();
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;

    if (ACTION[me.m.g] && [" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();

  addEventListener("blur", () => keys.clear());
  const DISP = '"Dela Gothic One", "Hiragino Sans", sans-serif';
  function bigText(c, txt, x, y, size, fill) {
    c.font = `${size}px ${DISP}`; c.textAlign = "center"; c.textBaseline = "middle";
    c.lineWidth = size / 6; c.strokeStyle = "rgba(20,18,42,.85)"; c.strokeText(txt, x, y);

  }
  const againBtns = (g) => `<div class="row"><button class="btn grow" data-act="start" data-g="${g}">もう一回</button><button class="btn ghost" data-act="menu">メニュー</button></div>`;

  // ----- 1対1サッカー -----
  // 世界座標: 横 FW × 縦 FH。先に始めた人(ホスト)が下から上のゴールをねらい、ボールの動きを計算して送る。
  const FW = 64, FH = 100, GW = 22, PR = 3, BR = 1.6, PSPD = 32, SOCCER_T = 90;
  ACTION.soccer = {
    shell() {
      return `<section style="display:flex;flex-direction:column;gap:12px">${topBar("1対1サッカー", "あなたは青。上のゴールをねらえ")}
        <section class="card act" style="padding:12px"><canvas id="cv" aria-label="サッカーのフィールド"></canvas><div id="act-msg"></div>
        <div class="ctrl"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="kick" id="kick">キック</button></div>
        <p class="muted">左の丸をドラッグして走る。ボールの近くで「キック」。体当たりでもドリブルできます。パソコンは矢印キー＋スペース。</p></section></section>`;
    },
    mount() {
      const host = isFirst();
      const cv = $("#cv");
      const VW = FW + 8, VH = FH + 14;
      const { c, w, h } = canvasFor(cv, VH / VW);
      const k = w / VW;
      const T = (x, y) => (host ? [(x + 4) * k, (y + 7) * k] : [(FW - x + 4) * k, (FH - y + 7) * k]);
      const rectW = (x0, y0, x1, y1) => { const [a, b] = T(x0, y0), [cc, d] = T(x1, y1); return [Math.min(a, cc), Math.min(b, d), Math.abs(cc - a), Math.abs(d - b)] };
      const home = () => ({ x: FW / 2, y: host ? FH - 16 : 16 });
      const P = Object.assign(home(), { fx: 0, fy: host ? -1 : 1, k: 0 });
      let ball = { x: FW / 2, y: FH / 2, vx: 0, vy: 0 };
      let S = { sh: 0, sg: 0, t: SOCCER_T, st: "wait", ko: 0, gt: 0, last: "" };
      let seenKo = 0, oppK = null, solo = false, oppPos = null, kickFx = 0;
      // own = ボールを持っている人（"h" ホスト / "g" あいて）。さわると持てて、キックで放す
      let own = null, stealCd = 0; const noGrab = { h: 0, g: 0 };
      const inp = { x: 0, y: 0 };

      const stick = $("#stick"), knob = $("#knob"); let sid = null;
      const setStick = (e) => {
        const r = stick.getBoundingClientRect();
        let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const R = r.width / 2 - 14, d = Math.hypot(dx, dy);
        if (d > R) { dx *= R / d; dy *= R / d }

      };

      stick.addEventListener("pointermove", (e) => { if (e.pointerId === sid) setStick(e) });
      const rel = (e) => { if (e.pointerId === sid) { sid = null; inp.x = inp.y = 0; knob.style.transform = "" } };
      stick.addEventListener("pointerup", rel); stick.addEventListener("pointercancel", rel);
      const doKick = () => { P.k++; kickFx = 0.15; if (host) tryKick(P, 0, "h") };
      $("#kick").addEventListener("pointerdown", (e) => { e.preventDefault(); doKick() });
      actKey = doKick;
      ui.soloSoccer = () => { solo = true };

      function tryKick(p, slack, who) {
        if (S.st !== "play") return;
        const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
        if (own !== who && d > PR + BR + 2.5 + slack) return;
        let nx = (p.fx || 0), ny = (p.fy || 0);
        if (own !== who) { nx = (dx / (d || 1)) * 0.4 + nx * 0.6; ny = (dy / (d || 1)) * 0.4 + ny * 0.6 }
        const m = Math.hypot(nx, ny) || 1;
        ball.vx = (nx / m) * 85; ball.vy = (ny / m) * 85;
        own = null; noGrab[who] = 0.35;
      }
      function collide(p, who) {
        const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy), m = PR + BR;
        if (d >= m + 0.8 || own === who) return;
        if (noGrab[who] <= 0 && (!own || stealCd <= 0)) { own = who; stealCd = 0.7; return }
        if (d >= m) return;
        const nx = d > 0.01 ? dx / d : 0, ny = d > 0.01 ? dy / d : -1;

      }
      function goal(who) {
        if (S.st !== "play") return;
        own = null;
        if (who === "h") S.sh++; else S.sg++;
        S.last = who; S.st = "goal"; S.gt = 1.8;
      }
      function stepBall(dt) {
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        const f = Math.pow(0.35, dt); ball.vx *= f; ball.vy *= f;
        const inMouth = Math.abs(ball.x - FW / 2) < GW / 2 - BR;
        if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx) * 0.8 }
        if (ball.x > FW - BR) { ball.x = FW - BR; ball.vx = -Math.abs(ball.vx) * 0.8 }
        if (!inMouth && ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy) * 0.8 }
        if (!inMouth && ball.y > FH - BR) { ball.y = FH - BR; ball.vy = -Math.abs(ball.vy) * 0.8 }

      }

        if (isMe) { c.fillStyle = "#FFE14D"; const top = sy - s * 3.2 - (carry ? Math.min(carry, 14) * s * 0.36 : 0); c.beginPath(); c.moveTo(sx - s * 0.4, top - s * 0.5); c.lineTo(sx + s * 0.4, top - s * 0.5); c.lineTo(sx, top); c.fill() }
      }
      function frame(dt) {
        let ix = inp.x, iy = inp.y;
        if (keys.has("ArrowLeft") || keys.has("a")) ix = -1; if (keys.has("ArrowRight") || keys.has("d")) ix = 1;
        if (keys.has("ArrowUp") || keys.has("w")) iy = -1; if (keys.has("ArrowDown") || keys.has("s")) iy = 1;
        const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m }
        const V0 = host ? null : view;
        const done = host ? Wd.done : V0 && V0.dn;
        const spd = host ? Wd.spd : (V0 && V0.pd[2] >= TY_PADS[2].cost ? 12.5 : 9);
        if (!done) { P.x = clamp(P.x + ix * spd * dt, 1, TW - 1); P.y = clamp(P.y + iy * spd * dt, 1.5, TH - 1); if (m > 0.2) { P.fx = ix; P.fy = iy } }
        const op = rtOppPeer(); const ox = op ? op.presence.x : null;
        let V;
        if (host) {
          hostStep(dt, ox && ox.px != null ? ox : null);
          V = packWorld();
          const out = { px: r2(P.x), py: r2(P.y), W: V }, js = JSON.stringify(out);
          if (js !== lastSend) { lastSend = js; sendX(out) }
        } else {
          if (ox && ox.W) view = ox.W;
          V = view || { tr: trees.map((t) => (t.zone === 0 ? "3" : "-")).join(""), m: 0, st: 0, pd: TY_PADS.map(() => 0), cap: 6, ca: [0, 0], cu: [], wk: null, t: 0, dn: 0 };
          const out = { px: r2(P.x), py: r2(P.y) }, js = JSON.stringify(out);
          if (js !== lastSend) { lastSend = js; sendX(out) }
        }
        for (let i = fx.length - 1; i >= 0; i--) if ((fx[i].t += dt) > 0.9) fx.splice(i, 1);
        const ppl = [{ x: P.x, y: P.y, c: ["#46CBF3", "#2390BA"], carry: V.ca[host ? 0 : 1], me: true }];
        if (ox && ox.px != null) ppl.push({ x: ox.px, y: ox.py, c: ["#EA4A40", "#A82C25"], carry: V.ca[host ? 1 : 0] });
        if (V.wk) ppl.push({ x: V.wk[0], y: V.wk[1], c: ["#5BBF6A", "#3A8A47"], carry: V.wk[2] });
        if (host && Wd.cp) ppl.push({ x: Wd.cp.x, y: Wd.cp.y, c: ["#F08A3C", "#C2601E"], carry: Wd.cp.carry });
        draw(V, ppl);
        if (V.dn) setMsg(`<p class="verdict good">クリア！ ${Math.floor(V.t / 60)}分${V.t % 60}秒</p>${againBtns("tycoon")}`);
        else if (!host && !view) setMsg(`<p class="wait">${esc(oppName())}の村につないでいます</p>`);
        else setMsg("");
      }
      return loop(frame);
    },
  };

  const RENDER = { ishin: renderIshin, quiz: renderQuiz, reflex: renderReflex, four: renderFour, hb: renderHb };

  // ---------- actions ----------
  function sendIshin() {
    const v = ui.draft.trim(); if (!v) return;
    const myA = me.s.a || [], os = oppS() || {};
    if (myA.length > Math.min(myA.length, (os.a || []).length)) return;
    ui.draft = ""; setS({ a: [...myA, v.slice(0, 30)] });
  }
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-act]"); if (!t) return;
    const act = t.dataset.act;
    if (act === "rename") { ui.renaming = true; render(); const i = $("#name-input"); if (i) i.focus() }
    else if (act === "rename-cancel") { ui.renaming = false; render() }
    else if (act === "rename-save") { const v = ($("#name-input").value || "").trim().slice(0, 12); if (v) { myName = v; ls.set("name", v) } ui.renaming = false; push(); render() }
    else if (act === "start") startMatch(t.dataset.g);
    else if (act === "menu") toMenu();
    else if (act === "ishin-send") sendIshin();
    else if (act === "ishin-ok") setS({ ok: [...(me.s.ok || []), Number(t.dataset.i)] });
    else if (act === "quiz-pick") {
      const mine = me.s.q || [], os = oppS() || {};
      if (mine.length > Math.min(mine.length, (os.q || []).length)) return;
      setS({ q: [...mine, Number(t.dataset.k)] });
    }
    else if (act === "rx-ready") setS({ rdy: rxRound() });
    else if (act === "four") {
      const st = fourState(); const c = Number(t.dataset.c);
      if (st.win || st.turn !== st.myP || st.grid[c].length >= H) return;
      setS({ mv: [...(me.s.mv || []), c] });
    }
    else if (act === "act-ready") setS({ rdy: true });
    else if (act === "code-new") { codeErr = ""; useChannel(String(Math.floor(1000 + Math.random() * 9000))) }
    else if (act === "code-join") joinCode(ui.codeDraft || ($("#code-input") || {}).value);
    else if (act === "code-leave") { codeState = ""; useChannel("") }
    else if (act === "code-link") {
      const url = location.origin + location.pathname + "#" + inviteCode;
      const done = () => { codeState = "linked"; render(); setTimeout(() => { codeState = ""; render() }, 1800) };
      if (navigator.share) navigator.share({ title: "待ち時間バトル", text: `招待コード ${inviteCode} で対戦しよう`, url }).catch(() => {});
      else { try { navigator.clipboard.writeText(url).then(done, done) } catch (e) { done() } }
    }
    else if (act === "code-copy") {
      const done = () => { codeState = "copied"; render(); setTimeout(() => { codeState = ""; render() }, 1500) };
      try { navigator.clipboard.writeText(inviteCode).then(done, done) } catch (e) { done() }
    }
    else if (act === "cpu-toggle") { cpuOn = !cpuOn; ls.set("cpu", cpuOn ? "on" : "off"); render() }
    else if (act === "solo-soccer") { if (ui.soloSoccer) ui.soloSoccer() }
    else if (act === "hb-key") { if (ui.hbEntry.length < 3 && !ui.hbEntry.includes(t.dataset.d)) { ui.hbEntry += t.dataset.d; render() } }
    else if (act === "hb-del") { ui.hbEntry = ui.hbEntry.slice(0, -1); render() }
    else if (act === "hb-secret") { if (ui.hbEntry.length === 3) { const v = ui.hbEntry; ui.hbEntry = ""; setS({ sec: v }) } }
    else if (act === "hb-guess") { if (ui.hbEntry.length === 3) { const v = ui.hbEntry; ui.hbEntry = ""; setS({ gs: [...(me.s.gs || []), v] }) } }
  });
  // reflex needs the fastest possible signal
  document.addEventListener("pointerdown", (ev) => { if (ev.target.closest("#pad")) { ev.preventDefault(); reflexTap() } });
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "ishin-input") ui.draft = ev.target.value;
    if (ev.target.id === "code-input") {
      ui.codeDraft = ev.target.value.replace(/\D/g, "").slice(0, 4);
      if (ui.codeDraft.length === 4) { ev.target.blur(); joinCode(ui.codeDraft) }
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" || ev.isComposing) return;
    if (ev.target.id === "ishin-input") { ev.preventDefault(); sendIshin() }
    if (ev.target.id === "name-input") { ev.preventDefault(); document.querySelector('[data-act="rename-save"]').click() }
    if (ev.target.id === "code-input") { ev.preventDefault(); joinCode(ev.target.value) }
  });


  // ---------- 公開サイト用のつなぎ方（Supabase Realtime のブロードキャスト。ログイン不要） ----------
  // room と同じ形（presence / peers / onPeers / join / leave）にそろえて、ゲーム側は同じコードで動かす
  const SUPA_WS = "wss://lcqpihitxmqaygriuhao.supabase.co/realtime/v1/websocket?vsn=1.0.0&apikey=" + "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcXBpaGl0eG1xYXlncml1aGFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMDQ1ODAsImV4cCI6MjA5NTY4MDU4MH0.vgZf_BwO58wnt5tKJO9jzJhkNarveb9A-_us-dxynVM";
  let SITE = false;
  function supaLobby() {
    return { connected: () => true, peers: () => [], onPeers: () => () => {}, onConnection: () => () => {}, presence: async () => {}, leave: async () => {}, join: async (name) => supaChannel(name) };
  }
  function supaChannel(name) {
    const topic = "realtime:gcplay-" + name, me_ = rid();
    let ws = null, ref = 0, joined = false, closed = false, mine = {}, lastSent = 0, timer = null;
    const peerMap = new Map(), hs = new Set(), chs = new Set();
    const list = () => [{ peer: me_, isMe: true, presence: mine, updatedAt: Date.now() }, ...[...peerMap.values()].map((p) => p.v)];
    const emitPeers = () => { const l = list(); hs.forEach((h) => { try { h({ peers: l }) } catch (e) {} }) };
    const setConn = (v) => { if (joined !== v) { joined = v; chs.forEach((h) => { try { h(v) } catch (e) {} }) } };
    const raw = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)) };
    const bc = (event, payload) => { if (joined) raw({ topic, event: "broadcast", payload: { type: "broadcast", event, payload }, ref: String(++ref), join_ref: "1" }) };
    const flush = () => { timer = null; lastSent = Date.now(); bc("p", { from: me_, st: mine }) };
    const schedule = () => { if (!timer) timer = setTimeout(flush, Math.max(0, 66 - (Date.now() - lastSent))) };
    function connect() {
      if (closed) return;
      try { ws = new WebSocket(SUPA_WS) } catch (e) { setTimeout(connect, 3000); return }
      ws.onopen = () => raw({ topic, event: "phx_join", payload: { config: { broadcast: { self: false, ack: false }, presence: { key: "" }, private: false } }, ref: "1", join_ref: "1" });
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data) } catch (_) { return }
        if (m.event === "phx_reply" && m.ref === "1") { if (m.payload && m.payload.status === "ok") { setConn(true); bc("hello", { from: me_ }); flush() } return }
        if (m.event !== "broadcast" || !m.payload) return;
        const ev = m.payload.event, d = m.payload.payload || {};
        if (!d.from || d.from === me_) return;
        if (ev === "hello") flush();
        else if (ev === "bye") { if (peerMap.delete(d.from)) emitPeers() }
        else if (ev === "p" && d.st && typeof d.st === "object") {
          const prev = peerMap.get(d.from), js = JSON.stringify(d.st), now = Date.now();
          if (prev && prev.js === js) { prev.seen = now; return }
          peerMap.set(d.from, { js, seen: now, v: { peer: d.from, isMe: false, presence: d.st, updatedAt: now } }); emitPeers();
        }
      };
      ws.onclose = () => { setConn(false); if (!closed) setTimeout(connect, 1200 + Math.random() * 1500) };
      ws.onerror = () => { try { ws.close() } catch (_) {} };
    }
    const hb = setInterval(() => raw({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++ref) }), 25000);
    const beat = setInterval(() => {
      flush(); const now = Date.now(); let ch = false;
      peerMap.forEach((p, k2) => { if (now - p.seen > 9000) { peerMap.delete(k2); ch = true } }); if (ch) emitPeers();
    }, 3000);
    const bye = () => bc("bye", { from: me_ });
    addEventListener("pagehide", bye);
    connect();
    return {
      name, connected: () => joined, peers: () => list(),
      onPeers(h) { hs.add(h); return () => hs.delete(h) }, onConnection(h) { chs.add(h); return () => chs.delete(h) },
      async presence(patch) { const n = Object.assign({}, mine); for (const k2 in patch) { if (patch[k2] === null) delete n[k2]; else n[k2] = patch[k2] } mine = n; schedule() },
      async leave() { bye(); closed = true; clearInterval(hb); clearInterval(beat); removeEventListener("pagehide", bye); setConn(false); try { ws && ws.close() } catch (_) {} },
    };
  }

  // ---------- connect ----------
  render();
  (async () => {
    try {
      const inArtifact = !!(window.claude && window.claude.use);
      const r = inArtifact ? await window.claude.use("room") : null;
      if (!r && inArtifact) { render(); return }
      SITE = !r;
      lobby = r || supaLobby(); room = lobby;
      const hc = (location.hash || "").slice(1);
      if (SITE && /^\d{4}$/.test(hc)) inviteCode = hc;
      await useChannel(inviteCode);
    } catch (e) { room = null; render() }
  })();
})();
