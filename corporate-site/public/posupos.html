<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポスポス｜飲食店・夜のお店のPOSレジ・会計ソフト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ポスポス（POSPOS）は、居酒屋・ラーメン・カフェなどの飲食店から、キャバクラ・ホスト・ガールズバーなど夜のお店まで使えるPOSレジ・会計ソフト。月額11,000円〜、初期費用0円、1か月無料。">
<meta property="og:title" content="ポスポス｜かんたん、つながる、会計ソフト。">
<meta property="og:url" content="https://akitogroup.jp/posupos">
<meta property="og:image" content="https://akitogroup.jp/assets/img/ogp-posupos-day.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://akitogroup.jp/posupos">
<meta name="theme-color" content="#1557D6">
<link rel="icon" href="assets/img/posupos-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
/* Layout: お店の種類を選ぶだけの入口。左右（スマホは上下）に、昼のお店／夜のお店の大きな札 */
:root{--blue:#1557D6;--sky:#288DFD;--navy:#13234A;--ink-2:#4A5878;--line:#DCE4F2;--white:#FFFFFF;--night:#0B1330;--lamp:#FFB547;--ff:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.1,1);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#F2F6FD,#fff);color:var(--navy);font-family:var(--ff);line-height:1.8;display:flex;flex-direction:column}
.wrap{max-width:1080px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;gap:10px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;text-decoration:none;color:var(--navy)}
.logo img{width:36px;height:36px}
main{flex:1;padding-block:clamp(24px,6vw,64px)}
h1{font-size:clamp(26px,5vw,42px);font-weight:900;line-height:1.4;margin:0;text-align:center;text-wrap:balance}
.lead{text-align:center;color:var(--ink-2);margin:10px 0 clamp(26px,5vw,44px)}
.pick{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.pick{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}}
.card{position:relative;overflow:hidden;border-radius:28px;padding:clamp(26px,4vw,40px);text-decoration:none;display:grid;gap:12px;min-height:260px;align-content:end;transition:transform .35s var(--ease),box-shadow .35s;animation:rise .8s var(--ease) backwards}
.card:nth-child(2){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.card:hover{transform:translateY(-6px)}
.card .ic{position:absolute;right:-20px;top:-20px;width:180px;height:180px;opacity:.9}
.card>*:not(.ic){position:relative}
@media (max-width:719px){.card .ic{width:130px;height:130px;opacity:.35}}
.card .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.card small{font-weight:700;font-size:14px;letter-spacing:.06em}
.card b{font-size:clamp(28px,4vw,38px);font-weight:900;line-height:1.3}
.card span{font-size:15px}
.card i{font-style:normal;display:inline-flex;align-items:center;gap:8px;font-weight:900;margin-top:6px;padding:12px 22px;border-radius:999px;justify-self:start}
.day{background:linear-gradient(140deg,#fff,#E6F0FF);border:1px solid var(--line);color:var(--navy);box-shadow:0 30px 60px -40px rgba(21,87,214,.6)}
.day .ic{color:var(--sky)}
.day small{color:var(--blue)}
.day span{color:var(--ink-2)}
.day i{background:var(--blue);color:#fff}
.night{background:radial-gradient(400px 300px at 90% 0%,rgba(255,181,71,.25),transparent 60%),var(--night);color:#ECF0FF;box-shadow:0 30px 60px -36px rgba(11,19,48,.8)}
.night .ic{color:var(--lamp)}
.night small{color:var(--lamp)}
.night span{color:#A9B4D6}
.night i{background:var(--lamp);color:#231500}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
footer{font-size:13px;color:var(--ink-2);padding-block:24px calc(24px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer a{color:inherit;text-decoration:none}
@media (prefers-reduced-motion:reduce){.card{animation:none;transition:none}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="./" aria-label="運営会社のトップへ"><img src="assets/img/posupos-mark.webp" alt="" width="600" height="600">ポスポス</a></div></header>
<main>
  <div class="wrap">
    <h1>かんたん、つながる、<br>会計ソフト。</h1>
    <p class="lead">お店の種類を選んでください。</p>
    <div class="pick">
      <a class="card day" href="/posupos-day">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <small>FOR RESTAURANTS</small>
        <b>昼のお店</b>
        <span>ラーメン・居酒屋・カフェ・焼肉・寿司など</span>
        <i>昼のお店のページへ →</i>
      </a>
      <a class="card night" href="/posupos-night">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></span>
        <small>FOR NIGHT</small>
        <b>夜のお店</b>
        <span>キャバクラ・ホスト・ガールズバー・コンカフェ・スナック・ラウンジ</span>
        <i>夜のお店のページへ →</i>
      </a>
    </div>
  </div>
</main>
<footer><div class="wrap"><a href="/contact#pos">お問い合わせ</a><span>© 2026 合同会社AKITOグループ</span></div></footer>
</body>
</html>
