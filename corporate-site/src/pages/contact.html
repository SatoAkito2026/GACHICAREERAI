<!--
title: お問い合わせ
description: AKITOグループへのお問い合わせ。インタビアAIの資料請求、コウムリンクのご相談、無料相談会のお申し込み、採用へのご応募はこちらから。
nav: contact
cta: no
-->
<style>
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(32px,5vw,72px);align-items:start}
.side{display:grid;gap:16px;position:sticky;top:110px}
.side .box{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff;display:grid;gap:4px}
.side .lbl{font-size:12px;color:var(--muted);font-weight:700}
.side .val{font-family:var(--ff-latin);font-weight:800;font-size:clamp(20px,2.4vw,24px);text-decoration:none;overflow-wrap:anywhere}
.side .sub{font-size:13px;color:var(--muted)}
.side .addr{font-size:14px;line-height:1.8}
@media (max-width:860px){.contact-grid{grid-template-columns:minmax(0,1fr)}.side{position:static}}

.form{display:grid;gap:22px;background:var(--paper-2);border-radius:24px;padding:clamp(22px,4vw,40px)}
.field{display:grid;gap:8px}
.field label{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.req{font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:5px;padding:1px 7px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
.field textarea{min-height:200px;resize:vertical;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(36,17,63,.08)}
.field .hint{font-size:12.5px;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.agree{font-size:13px;color:var(--muted)}
.form .btn{justify-self:start;min-width:220px}
.form .btn[disabled]{opacity:.6;cursor:progress}
.status{border-radius:14px;padding:16px 18px;font-weight:700;font-size:15px}
.status.ok{background:rgba(63,174,58,.12);color:var(--green-text)}
.status.ng{background:rgba(238,22,80,.08);color:var(--red)}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.topics button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.topics button:hover{border-color:var(--ink)}
.topics button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>

<section class="page-hero">
  <svg class="ribbon" viewBox="0 0 520 140" aria-hidden="true"><path class="r1" pathLength="100" d="M10 40 C 140 0, 260 120, 510 50"/><path class="r2" pathLength="100" d="M10 70 C 140 30, 260 150, 510 80"/><path class="r3" pathLength="100" d="M10 100 C 140 60, 260 180, 510 110"/></svg>
  <div class="wrap">
    <nav class="crumbs" aria-label="現在地"><a href="./">トップ</a> / お問い合わせ</nav>
    <p class="eyebrow">Contact</p>
    <h1>お問い合わせ</h1>
    <p class="lead">インタビアAIの資料請求、コウムリンクのご相談、無料相談会のお申し込み、採用へのご応募など、お気軽にどうぞ。内容を確認のうえ、担当者からご連絡します。</p>
  </div>
</section>

<section class="block">
  <div class="wrap contact-grid">
    <aside class="side rv">
      <div class="box">
        <span class="lbl">お電話</span>
        <a class="val" href="tel:08024204900">080-2420-4900</a>
        <span class="sub">年中無休　9:00〜21:00</span>
      </div>
      <div class="box">
        <span class="lbl">メール</span>
        <a class="val" href="mailto:info@akitogroup.jp">info@akitogroup.jp</a>
      </div>
      <div class="box">
        <span class="lbl">所在地</span>
        <span class="addr">〒170-0013<br>東京都豊島区東池袋2丁目62番8号<br>BIGオフィスプラザ池袋1206</span>
      </div>
    </aside>

    <form class="form rv" id="contact-form" novalidate>
      <div class="field">
        <span style="font-weight:700;font-size:14px">ご用件</span>
        <ul class="topics" id="topics">
          <li><button type="button" data-topic="intervia" aria-pressed="false">インタビアAIの資料請求・導入</button></li>
          <li><button type="button" data-topic="koumu" aria-pressed="false">コウムリンク（人材・営業代行）</button></li>
          <li><button type="button" data-topic="consult" aria-pressed="false">無料相談会の申し込み</button></li>
          <li><button type="button" data-topic="recruit" aria-pressed="false">採用への応募</button></li>
          <li><button type="button" data-topic="casting" aria-pressed="false">芸能・キャスティングプラン</button></li>
          <li><button type="button" data-topic="other" aria-pressed="false">その他</button></li>
        </ul>
      </div>
      <div class="field">
        <label for="f-name">お名前 <span class="req">必須</span></label>
        <input id="f-name" name="name" type="text" autocomplete="name" maxlength="100" required>
      </div>
      <div class="field">
        <label for="f-company">会社名・団体名</label>
        <input id="f-company" name="company" type="text" autocomplete="organization" maxlength="100">
        <span class="hint">個人の方は空欄で大丈夫です。</span>
      </div>
      <div class="field">
        <label for="f-email">メールアドレス <span class="req">必須</span></label>
        <input id="f-email" name="email" type="email" autocomplete="email" maxlength="200" required>
      </div>
      <div class="field">
        <label for="f-tel">電話番号</label>
        <input id="f-tel" name="tel" type="tel" autocomplete="tel" maxlength="30">
      </div>
      <div class="field">
        <label for="f-subject">件名 <span class="req">必須</span></label>
        <input id="f-subject" name="subject" type="text" maxlength="200" required>
      </div>
      <div class="field">
        <label for="f-message">お問い合わせ内容 <span class="req">必須</span></label>
        <textarea id="f-message" name="message" maxlength="4000" required></textarea>
      </div>
      <div class="hp" aria-hidden="true"><label for="f-website">空欄のままにしてください</label><input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <p class="agree">送信いただいた内容は、お問い合わせへの回答のためだけに使います。</p>
      <div id="form-status" class="status" role="status" hidden></div>
      <button class="btn btn-ink" type="submit" id="f-submit">送信する <span class="arr" aria-hidden="true">→</span></button>
    </form>
  </div>
</section>

<script>
(function(){
  var form=document.getElementById('contact-form');
  var subject=document.getElementById('f-subject');
  var status=document.getElementById('form-status');
  var submit=document.getElementById('f-submit');
  var LABELS={intervia:'インタビアAIの資料請求・導入について',koumu:'コウムリンク（人材・営業代行）について',consult:'無料相談会の申し込み',recruit:'採用への応募',casting:'芸能・キャスティングプランについて',other:''};
  var topic='';
  var pick=function(key,fill){
    topic=LABELS.hasOwnProperty(key)?key:'';
    document.querySelectorAll('#topics button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-topic')===topic?'true':'false')});
    if(fill&&topic&&LABELS[topic]&&!subject.value)subject.value=LABELS[topic];
  };
  document.querySelectorAll('#topics button').forEach(function(b){
    b.addEventListener('click',function(){
      var prev=LABELS[topic]||'';
      if(subject.value===prev)subject.value='';
      pick(b.getAttribute('data-topic'),true);
    });
  });
  var h=(location.hash||'').slice(1);
  if(h)pick(h,true);

  var show=function(ok,msg){status.hidden=false;status.className='status '+(ok?'ok':'ng');status.textContent=msg};

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var data={};
    new FormData(form).forEach(function(v,k){data[k]=String(v).trim()});
    data.topic=topic;
    if(!data.name||!data.email||!data.subject||!data.message){show(false,'お名前・メールアドレス・件名・お問い合わせ内容を入力してください。');return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){show(false,'メールアドレスの形をご確認ください（例：name@example.com）。');return}
    submit.disabled=true;submit.firstChild.textContent='送信しています… ';
    fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {ok:r.ok,j:j}})})
      .then(function(res){
        if(res.ok){form.reset();pick('',false);show(true,'送信しました。内容を確認のうえ、担当者からご連絡します。');}
        else show(false,(res.j&&res.j.error)||'送信できませんでした。お手数ですが、info@akitogroup.jp へメールでご連絡ください。');
      })
      .catch(function(){show(false,'送信できませんでした。通信の状態を確かめるか、info@akitogroup.jp へメールでご連絡ください。')})
      .then(function(){submit.disabled=false;submit.firstChild.textContent='送信する '});
  });
})();
</script>
